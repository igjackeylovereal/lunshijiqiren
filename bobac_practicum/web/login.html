<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身份验证 · BOBAC</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:720px"><header><div><p class="eyebrow">BOBAC · 操控入口</p><h1>请先完成人脸验证</h1><p>单人正面入镜，保持正常光照。稳定识别约几秒后进入配置。</p></div></header><p id="preview" class="notice" hidden>离线演示：身份输入与地图均为模拟数据，不连接机器人，不采集人脸。</p><section><div class="camera"><img id="camera" src="/camera.jpg" alt="等待机器人相机"><span id="cameraNote">等待相机</span></div><p id="status" role="status">点击开始后进行验证</p><div class="row"><button id="begin">开始验证并启用电脑语音</button><button id="enter" hidden>进入配置</button></div><div id="simulation" hidden><p>仅限离线预览的模拟输入：</p><select id="simPerson"></select><button id="simulate">模拟该身份</button></div><div id="bootstrap" hidden><h2>首次初始化</h2><p>尚无任何样本。仅此时允许录入第一位授权人员；开始采集后关闭此入口。</p><select id="person"></select><label class="consent"><input type="checkbox" id="consent">本人同意录入，且仅本人入镜</label><button id="enroll">初始化录入30张</button></div></section><p class="muted">验证通过后的配置会话不按时间自动过期。主动退出、浏览器会话结束或服务重启后需重新验证。人脸识别未包含活体检测。</p></main><script src="/login.js"></script></body></html>
